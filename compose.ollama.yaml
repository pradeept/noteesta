name: noteesta

services:
  web:
    image: pradeept17/noteesta-web:latest
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    image: pradeept17/noteesta-api:latest
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      NOTEESTA_AUTH_ENABLED: ${NOTEESTA_AUTH_ENABLED:-false}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in apps/api/.env}
      MONGODB_VECTOR_INDEX: ${MONGODB_VECTOR_INDEX:-vector_index}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8

  worker:
    image: pradeept17/noteesta-api:latest
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
      ]
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      NOTEESTA_AUTH_ENABLED: ${NOTEESTA_AUTH_ENABLED:-false}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in apps/api/.env}
      MONGODB_VECTOR_INDEX: ${MONGODB_VECTOR_INDEX:-vector_index}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      ollama:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-noteesta}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me}
      S3_BUCKET: ${S3_BUCKET:-noteesta}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs-data:/data

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  seaweedfs-data:
  ollama-data:
