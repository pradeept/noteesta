name: noteesta

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_DEMO_USER_ID: ${NEXT_PUBLIC_DEMO_USER_ID:-demo-user}
        NEXT_PUBLIC_ENABLE_DEMO_DATA: ${NEXT_PUBLIC_ENABLE_DEMO_DATA:-true}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - path: api/.env
        required: false
    environment:
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in api/.env}
      MONGODB_VECTOR_INDEX: ${MONGODB_VECTOR_INDEX:-vector_index}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://seaweedfs:8333
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
      ]
    env_file:
      - path: api/.env
        required: false
    environment:
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in api/.env}
      MONGODB_VECTOR_INDEX: ${MONGODB_VECTOR_INDEX:-vector_index}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://seaweedfs:8333
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-noteesta}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me}
      S3_BUCKET: ${S3_BUCKET:-noteesta}
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data

volumes:
  seaweedfs-data:
