<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 916" role="img" aria-labelledby="title desc"><title id="title">Select and use optional study materials</title><desc id="desc">Extras are selected before generation and produced with the notes. They never replace the primary notes experience. Student chooses extras: Any combination of flashcards, MCQs, true/false, roadmap. Generate with notes: Worker uses the same complete Pill source snapshot. Validate optional outputs: Answer, explanation, and source evidence for each question. Open a selected material: Keep notes and navigation easy to return to. Reveal, answer, or follow steps: Flashcard reveal; question answer; roadmap section link. Show explanation and evidence: Feedback includes the correct answer and source reference. Return to the notes: Preserve position and session context</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466752"/></marker></defs><rect width="920" height="916" fill="#fff"/><g font-family="Arial,sans-serif" fill="#23372a"><text x="40" y="40" font-size="22" font-weight="600">Select and use optional study materials</text><text x="40" y="68" font-size="13" fill="#526157">Extras are selected before generation and produced with the notes. They never replace the primary</text><text x="40" y="87" font-size="13" fill="#526157">notes experience.</text><rect x="40" y="115" width="450" height="82" rx="9" fill="#e7efe9" stroke="#bdccbf"/><text x="59" y="142" font-size="16" font-weight="600">Student chooses extras</text><text x="59" y="164" font-size="12" fill="#526157">Any combination of flashcards, MCQs, true/false, roadmap</text><path d="M265 197V216" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="223" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="250" font-size="16" font-weight="600">Generate with notes</text><text x="59" y="272" font-size="12" fill="#526157">Worker uses the same complete Pill source snapshot</text><path d="M265 305V324" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="331" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="358" font-size="16" font-weight="600">Validate optional outputs</text><text x="59" y="380" font-size="12" fill="#526157">Answer, explanation, and source evidence for each question</text><path d="M265 413V432" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="439" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="466" font-size="16" font-weight="600">Open a selected material</text><text x="59" y="488" font-size="12" fill="#526157">Keep notes and navigation easy to return to</text><path d="M265 521V540" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="547" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="574" font-size="16" font-weight="600">Reveal, answer, or follow steps</text><text x="59" y="596" font-size="12" fill="#526157">Flashcard reveal; question answer; roadmap section link</text><path d="M265 629V648" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="655" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="682" font-size="16" font-weight="600">Show explanation and evidence</text><text x="59" y="704" font-size="12" fill="#526157">Feedback includes the correct answer and source reference</text><path d="M265 737V756" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="763" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="790" font-size="16" font-weight="600">Return to the notes</text><text x="59" y="812" font-size="12" fill="#526157">Preserve position and session context</text><rect x="540" y="160" width="340" height="180" rx="9" fill="#edf1f8" stroke="#c5d0e0"/><text x="560" y="190" font-size="15" font-weight="600">No extras selected</text><text x="560" y="221" font-size="13">Generate and show notes with visuals</text><text x="560" y="242" font-size="13">only. Do not reserve empty tabs.</text><rect x="540" y="395" width="340" height="180" rx="9" fill="#edf1f8" stroke="#c5d0e0"/><text x="560" y="425" font-size="15" font-weight="600">Roadmap</text><text x="560" y="456" font-size="13">An ordered study checklist linked to</text><text x="560" y="477" font-size="13">relevant sections; not a separate</text><text x="560" y="498" font-size="13">scheduling product.</text></g></svg>
