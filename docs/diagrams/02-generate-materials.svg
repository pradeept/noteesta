<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 916" role="img" aria-labelledby="title desc"><title id="title">Generate notes and optional study materials</title><desc id="desc">Cover every section of the selected source snapshot before synthesizing the final notes. Vector search is not the coverage mechanism. FastAPI accepts job: Return job ID immediately. Redis broker → Celery worker: Queue heavy work outside HTTP request handlers. Parse and transcribe selected sources: Docling + FFmpeg + faster-whisper / Whisper small. Process every source section: Preserve page, timestamp, and source references. Generate notes and selected extras: Qwen3-VL-8B-Instruct through Ollama. Validate and render visuals: Check structure, citations, and source-supported chart data. Save artifacts and notify UI: Markdown + visual assets in object storage; status in MongoDB</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466752"/></marker></defs><rect width="920" height="916" fill="#fff"/><g font-family="Arial,sans-serif" fill="#23372a"><text x="40" y="40" font-size="22" font-weight="600">Generate notes and optional study materials</text><text x="40" y="68" font-size="13" fill="#526157">Cover every section of the selected source snapshot before synthesizing the final notes. Vector</text><text x="40" y="87" font-size="13" fill="#526157">search is not the coverage mechanism.</text><rect x="40" y="115" width="450" height="82" rx="9" fill="#e7efe9" stroke="#bdccbf"/><text x="59" y="142" font-size="16" font-weight="600">FastAPI accepts job</text><text x="59" y="164" font-size="12" fill="#526157">Return job ID immediately</text><path d="M265 197V216" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="223" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="250" font-size="16" font-weight="600">Redis broker → Celery worker</text><text x="59" y="272" font-size="12" fill="#526157">Queue heavy work outside HTTP request handlers</text><path d="M265 305V324" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="331" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="358" font-size="16" font-weight="600">Parse and transcribe selected sources</text><text x="59" y="380" font-size="12" fill="#526157">Docling + FFmpeg + faster-whisper / Whisper small</text><path d="M265 413V432" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="439" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="466" font-size="16" font-weight="600">Process every source section</text><text x="59" y="488" font-size="12" fill="#526157">Preserve page, timestamp, and source references</text><path d="M265 521V540" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="547" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="574" font-size="16" font-weight="600">Generate notes and selected extras</text><text x="59" y="596" font-size="12" fill="#526157">Qwen3-VL-8B-Instruct through Ollama</text><path d="M265 629V648" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="655" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="682" font-size="16" font-weight="600">Validate and render visuals</text><text x="59" y="704" font-size="12" fill="#526157">Check structure, citations, and source-supported chart</text><text x="59" y="721" font-size="12" fill="#526157">data</text><path d="M265 737V756" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="763" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="790" font-size="16" font-weight="600">Save artifacts and notify UI</text><text x="59" y="812" font-size="12" fill="#526157">Markdown + visual assets in object storage; status in</text><text x="59" y="829" font-size="12" fill="#526157">MongoDB</text><rect x="540" y="160" width="340" height="180" rx="9" fill="#edf1f8" stroke="#c5d0e0"/><text x="560" y="190" font-size="15" font-weight="600">In parallel</text><text x="560" y="221" font-size="13">Embed parsed chunks with an open-weight</text><text x="560" y="242" font-size="13">embedding model and index them for scoped</text><text x="560" y="263" font-size="13">retrieval.</text><rect x="540" y="395" width="340" height="180" rx="9" fill="#edf1f8" stroke="#c5d0e0"/><text x="560" y="425" font-size="15" font-weight="600">Failure / retry</text><text x="560" y="456" font-size="13">Persist stage and error. Retry transient</text><text x="560" y="477" font-size="13">failures with bounded attempts; avoid</text><text x="560" y="498" font-size="13">duplicate artifacts.</text></g></svg>
