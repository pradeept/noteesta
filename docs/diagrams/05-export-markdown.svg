<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 916" role="img" aria-labelledby="title desc"><title id="title">Export a portable study pack</title><desc id="desc">Export remains usable outside Noteesta without live asset URLs or application-specific diagram rendering. Student requests export: Choose the current Pill's generated material. FastAPI authorizes export: Verify ownership of Pill and referenced artifacts. Collect the selected artifacts: Markdown notes, optional extras, and rendered PNG visuals. Make references portable: Relative asset paths, text citations, page numbers, timestamps. Build ZIP archive: notes.md, selected extra files, and assets/. Download study pack: Serve authorized short-lived download. Open in a Markdown reader: Images load from the bundled assets directory</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466752"/></marker></defs><rect width="920" height="916" fill="#fff"/><g font-family="Arial,sans-serif" fill="#23372a"><text x="40" y="40" font-size="22" font-weight="600">Export a portable study pack</text><text x="40" y="68" font-size="13" fill="#526157">Export remains usable outside Noteesta without live asset URLs or application-specific diagram</text><text x="40" y="87" font-size="13" fill="#526157">rendering.</text><rect x="40" y="115" width="450" height="82" rx="9" fill="#e7efe9" stroke="#bdccbf"/><text x="59" y="142" font-size="16" font-weight="600">Student requests export</text><text x="59" y="164" font-size="12" fill="#526157">Choose the current Pill's generated material</text><path d="M265 197V216" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="223" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="250" font-size="16" font-weight="600">FastAPI authorizes export</text><text x="59" y="272" font-size="12" fill="#526157">Verify ownership of Pill and referenced artifacts</text><path d="M265 305V324" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="331" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="358" font-size="16" font-weight="600">Collect the selected artifacts</text><text x="59" y="380" font-size="12" fill="#526157">Markdown notes, optional extras, and rendered PNG visuals</text><path d="M265 413V432" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="439" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="466" font-size="16" font-weight="600">Make references portable</text><text x="59" y="488" font-size="12" fill="#526157">Relative asset paths, text citations, page numbers,</text><text x="59" y="505" font-size="12" fill="#526157">timestamps</text><path d="M265 521V540" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="547" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="574" font-size="16" font-weight="600">Build ZIP archive</text><text x="59" y="596" font-size="12" fill="#526157">notes.md, selected extra files, and assets/</text><path d="M265 629V648" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="655" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="682" font-size="16" font-weight="600">Download study pack</text><text x="59" y="704" font-size="12" fill="#526157">Serve authorized short-lived download</text><path d="M265 737V756" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="763" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="790" font-size="16" font-weight="600">Open in a Markdown reader</text><text x="59" y="812" font-size="12" fill="#526157">Images load from the bundled assets directory</text><rect x="540" y="160" width="340" height="180" rx="9" fill="#edf1f8" stroke="#c5d0e0"/><text x="560" y="190" font-size="15" font-weight="600">Source originals</text><text x="560" y="221" font-size="13">Original class recordings and documents</text><text x="560" y="242" font-size="13">are not bundled by default; exported</text><text x="560" y="263" font-size="13">citations retain readable references.</text><rect x="540" y="395" width="340" height="180" rx="9" fill="#edf1f8" stroke="#c5d0e0"/><text x="560" y="425" font-size="15" font-weight="600">Export error</text><text x="560" y="456" font-size="13">Keep generated material intact and offer</text><text x="560" y="477" font-size="13">retry. Never mark a partial archive</text><text x="560" y="498" font-size="13">complete.</text></g></svg>
