<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 1080" role="img" aria-labelledby="title desc">
<title id="title">Noteesta system architecture</title><desc id="desc">Next.js calls FastAPI. FastAPI authorizes requests, stores metadata in MongoDB and files in object storage, and queues jobs through Redis. Celery workers consume jobs, use Docling, Whisper small, an open-weight embedding model, and Qwen3-VL through Ollama. Workers persist status and artifacts. The frontend polls FastAPI for progress. Chat uses scoped MongoDB retrieval and the same model services.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#567160"/></marker></defs>
<rect width="1380" height="1080" fill="#fff"/>
<g font-family="Arial,sans-serif" fill="#24392b">
<text x="40" y="44" font-size="26" font-weight="600">Noteesta / system architecture</text><text x="40" y="72" font-size="14" fill="#536459">Heavy processing runs in Celery. FastAPI owns authorization, job submission, and access to results.</text>
<g stroke="#567160" stroke-width="2" fill="none" marker-end="url(#arrow)">
