<rect x="40" y="750" width="290" height="125" rx="10" fill="#edf1f8" stroke="#b7c7de"/><text x="59" y="782" font-size="20" font-weight="600">Docling</text><text x="59" y="813" font-size="14">PDF / DOCX / images / layout</text><text x="59" y="836" font-size="14">OCR and document structure</text><text x="59" y="858" font-size="12" fill="#536459">Keep page and source provenance</text>
