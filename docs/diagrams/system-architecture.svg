<rect x="520" y="113" width="330" height="124" rx="10" fill="#e5efe7" stroke="#a9c3b0"/><text x="541" y="145" font-size="20" font-weight="600">FastAPI backend</text><text x="541" y="176" font-size="14">Authorization · source snapshots</text><text x="541" y="199" font-size="14">Job API · grounded chat · exports</text><text x="541" y="220" font-size="12" fill="#536459">Returns job ID without waiting for generation</text>
<rect x="1035" y="113" width="305" height="124" rx="10" fill="#f2f5f2" stroke="#b7c9bb"/><text x="1054" y="145" font-size="19" font-weight="600">MongoDB + Vector Search</text><text x="1054" y="176" font-size="14">Pills · users · source metadata</text><text x="1054" y="199" font-size="14">Job status · chunks · embeddings</text><text x="1054" y="220" font-size="12" fill="#536459">Filter by authorized user + Pill sources</text>
<rect x="520" y="311" width="330" height="78" rx="10" fill="#f3f5f3" stroke="#b7c9bb"/><text x="541" y="342" font-size="19" font-weight="600">Redis</text><text x="541" y="368" font-size="14">Celery task broker</text>
<rect x="520" y="473" width="330" height="121" rx="10" fill="#e5efe7" stroke="#a9c3b0"/><text x="541" y="505" font-size="20" font-weight="600">Celery workers</text><text x="541" y="535" font-size="14">Parse → cover every section → synthesize</text><text x="541" y="558" font-size="14">Validate → render → persist artifacts</text><text x="541" y="579" font-size="12" fill="#536459">Bounded retries and idempotent stages</text>
