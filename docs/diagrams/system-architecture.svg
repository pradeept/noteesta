<rect x="680" y="750" width="300" height="125" rx="10" fill="#edf1f8" stroke="#b7c7de"/><text x="699" y="782" font-size="20" font-weight="600">Ollama model server</text><text x="699" y="813" font-size="14">Qwen3-VL-8B-Instruct</text><text x="699" y="836" font-size="14">Open weights · text + vision</text><text x="699" y="858" font-size="12" fill="#536459">Notes, extras, selected-frame interpretation</text>
<rect x="1005" y="750" width="335" height="125" rx="10" fill="#edf1f8" stroke="#b7c7de"/><text x="1024" y="782" font-size="20" font-weight="600">Embedding runtime</text><text x="1024" y="813" font-size="14">Open-weight embedding model</text><text x="1024" y="836" font-size="14">Same model for chunks and questions</text><text x="1024" y="858" font-size="12" fill="#536459">Exact model remains to be selected</text>
<rect x="40" y="923" width="1300" height="110" rx="10" fill="#f5f7f5" stroke="#d4ddd5"/><text x="60" y="954" font-size="16" font-weight="600">Request and data boundaries</text><text x="60" y="979" font-size="14">Chat: FastAPI → embedding runtime → scoped MongoDB retrieval → Ollama → cited answer. No Celery job required for short chat requests.</text><text x="60" y="1004" font-size="14">Progress: workers write job state to MongoDB; the frontend polls FastAPI. Browsers never connect directly to Redis or model services.</text>
</g></svg>
