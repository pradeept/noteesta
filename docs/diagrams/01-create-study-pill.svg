<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 916" role="img" aria-labelledby="title desc"><title id="title">Create a Study Pill and select sources</title><desc id="desc">A student explicitly chooses which resources belong to the Pill. New uploads and existing objects can be combined. Student: Starts a new Study Pill. Select resources: Upload files, add YouTube, or reuse owned objects. FastAPI validates sources: Check ownership, file type, size, and URL. Store originals and references: Object storage holds files; MongoDB holds source metadata. Save isolated source selection: Bind authorized source IDs to user ID and Pill ID. Choose optional materials: Notes always included; extras independently selected. Request generation: Save source-version snapshot and create job</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466752"/></marker></defs><rect width="920" height="916" fill="#fff"/><g font-family="Arial,sans-serif" fill="#23372a"><text x="40" y="40" font-size="22" font-weight="600">Create a Study Pill and select sources</text><text x="40" y="68" font-size="13" fill="#526157">A student explicitly chooses which resources belong to the Pill. New uploads and existing objects</text><text x="40" y="87" font-size="13" fill="#526157">can be combined.</text><rect x="40" y="115" width="450" height="82" rx="9" fill="#e7efe9" stroke="#bdccbf"/><text x="59" y="142" font-size="16" font-weight="600">Student</text><text x="59" y="164" font-size="12" fill="#526157">Starts a new Study Pill</text><path d="M265 197V216" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="223" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="250" font-size="16" font-weight="600">Select resources</text><text x="59" y="272" font-size="12" fill="#526157">Upload files, add YouTube, or reuse owned objects</text><path d="M265 305V324" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="331" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="358" font-size="16" font-weight="600">FastAPI validates sources</text><text x="59" y="380" font-size="12" fill="#526157">Check ownership, file type, size, and URL</text><path d="M265 413V432" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="439" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="466" font-size="16" font-weight="600">Store originals and references</text><text x="59" y="488" font-size="12" fill="#526157">Object storage holds files; MongoDB holds source metadata</text><path d="M265 521V540" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="547" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="574" font-size="16" font-weight="600">Save isolated source selection</text><text x="59" y="596" font-size="12" fill="#526157">Bind authorized source IDs to user ID and Pill ID</text><path d="M265 629V648" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="655" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="682" font-size="16" font-weight="600">Choose optional materials</text><text x="59" y="704" font-size="12" fill="#526157">Notes always included; extras independently selected</text><path d="M265 737V756" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="763" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="790" font-size="16" font-weight="600">Request generation</text><text x="59" y="812" font-size="12" fill="#526157">Save source-version snapshot and create job</text><rect x="540" y="160" width="340" height="180" rx="9" fill="#edf1f8" stroke="#c5d0e0"/><text x="560" y="190" font-size="15" font-weight="600">YouTube</text><text x="560" y="221" font-size="13">Resolve accessible captions or authorized</text><text x="560" y="242" font-size="13">media. Show an actionable error if</text><text x="560" y="263" font-size="13">unavailable.</text><rect x="540" y="395" width="340" height="180" rx="9" fill="#edf1f8" stroke="#c5d0e0"/><text x="560" y="425" font-size="15" font-weight="600">Validation fails</text><text x="560" y="456" font-size="13">Keep valid selections. Explain the</text><text x="560" y="477" font-size="13">affected file or URL and let the student</text><text x="560" y="498" font-size="13">correct it.</text></g></svg>
