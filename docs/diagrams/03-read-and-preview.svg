<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 916" role="img" aria-labelledby="title desc"><title id="title">Read notes, inspect a visual, and follow evidence</title><desc id="desc">A calm reading surface preserves context while making diagrams and source references accessible. Student opens a Study Pill: FastAPI authorizes Pill access. Load saved notes and assets: Show sections, citations, and chosen study materials. Render the Markdown document: Semantic headings, tables, formulas, and image descriptions. Activate a chart or image: Open accessible preview; support keyboard and zoom. Close using Escape or close button: Restore focus and reading position. Activate a source citation: Open authorized source at its page or timestamp. Return to the document: Resume at the original passage</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466752"/></marker></defs><rect width="920" height="916" fill="#fff"/><g font-family="Arial,sans-serif" fill="#23372a"><text x="40" y="40" font-size="22" font-weight="600">Read notes, inspect a visual, and follow evidence</text><text x="40" y="68" font-size="13" fill="#526157">A calm reading surface preserves context while making diagrams and source references accessible.</text><rect x="40" y="115" width="450" height="82" rx="9" fill="#e7efe9" stroke="#bdccbf"/><text x="59" y="142" font-size="16" font-weight="600">Student opens a Study Pill</text><text x="59" y="164" font-size="12" fill="#526157">FastAPI authorizes Pill access</text><path d="M265 197V216" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="223" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="250" font-size="16" font-weight="600">Load saved notes and assets</text><text x="59" y="272" font-size="12" fill="#526157">Show sections, citations, and chosen study materials</text><path d="M265 305V324" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="331" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="358" font-size="16" font-weight="600">Render the Markdown document</text><text x="59" y="380" font-size="12" fill="#526157">Semantic headings, tables, formulas, and image</text><text x="59" y="397" font-size="12" fill="#526157">descriptions</text><path d="M265 413V432" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="439" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="466" font-size="16" font-weight="600">Activate a chart or image</text><text x="59" y="488" font-size="12" fill="#526157">Open accessible preview; support keyboard and zoom</text><path d="M265 521V540" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="547" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="574" font-size="16" font-weight="600">Close using Escape or close button</text><text x="59" y="596" font-size="12" fill="#526157">Restore focus and reading position</text><path d="M265 629V648" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="655" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="682" font-size="16" font-weight="600">Activate a source citation</text><text x="59" y="704" font-size="12" fill="#526157">Open authorized source at its page or timestamp</text><path d="M265 737V756" stroke="#466752" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="763" width="450" height="82" rx="9" fill="#f6f8f6" stroke="#bdccbf"/><text x="59" y="790" font-size="16" font-weight="600">Return to the document</text><text x="59" y="812" font-size="12" fill="#526157">Resume at the original passage</text><rect x="540" y="160" width="340" height="180" rx="9" fill="#edf1f8" stroke="#c5d0e0"/><text x="560" y="190" font-size="15" font-weight="600">Accessibility</text><text x="560" y="221" font-size="13">Trap focus in the modal. Respect text</text><text x="560" y="242" font-size="13">resizing, reduced motion, and readable</text><text x="560" y="263" font-size="13">contrast.</text><rect x="540" y="395" width="340" height="180" rx="9" fill="#edf1f8" stroke="#c5d0e0"/><text x="560" y="425" font-size="15" font-weight="600">Missing asset</text><text x="560" y="456" font-size="13">Keep the text available. Show an image</text><text x="560" y="477" font-size="13">description and an explicit retry action.</text></g></svg>
