name: Noteesta dependencies

services:
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - '6379:6379'
  #   healthcheck:
  #     test: ['CMD', 'redis-cli', 'ping']
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ['mini', '-dir=/data']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-noteesta}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me}
      S3_BUCKET: ${S3_BUCKET:-noteesta}
    ports:
      - '8333:8333'
    volumes:
      - seaweedfs-data:/data

volumes:
  seaweedfs-data:
