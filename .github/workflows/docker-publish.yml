name: Publish Docker images

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

# Serialize reruns for the same commit without interrupting image uploads.
concurrency:
  group: docker-build-${{ github.event.pull_request.merge_commit_sha || github.run_id }}
  cancel-in-progress: false

env:
  MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}

jobs:
  build:
    if: github.event.pull_request.merged == true
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        image: [web, api]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
        # Explicit architecture axis keeps one image/platform on each runner.
        arch: [amd64, arm64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      IMAGE: ${{ matrix.image }}
      ARCH: ${{ matrix.arch }}
    steps:
      # Only the commit already merged into main is trusted with registry access.
      # Never replace this ref with pull_request.head.sha or a fork's branch.
      - name: Check out merged main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: pradeept17
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Reuse an existing commit image
        id: existing
        run: node .github/scripts/docker-publish.mjs inspect

      - name: Free runner disk space
        if: steps.existing.outputs.exists != 'true'
        run: |
          df -h /
          # These SDKs are unused by either Dockerfile. Never prune Docker's cache.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build and push platform image by digest
        if: steps.existing.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=docker.io/pradeept17/noteesta-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.merge_commit_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }},ignore-error=true

      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: node .github/scripts/docker-publish.mjs record

      - name: Upload digest metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/docker-digests/*.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish multi-platform tags
    needs: build
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: docker-publish-main
      cancel-in-progress: false
    steps:
      - name: Check out merged main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: pradeept17
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download digest metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/docker-digests
          merge-multiple: true

      - name: Publish commit tags and promote current main
        run: node .github/scripts/docker-publish.mjs publish
